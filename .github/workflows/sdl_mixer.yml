name: Build SDL_mixer Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: release-3.4.12
  SDL_MIXER_VERSION: release-3.2.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            library: SDL3_mixer.dll
          - os: ubuntu-latest
            target: linux-x64
            library: libSDL3_mixer.so
          - os: ubuntu-22.04-arm
            target: linux-arm64
            library: libSDL3_mixer.so
          - os: macos-13
            target: osx-x64
            library: libSDL3_mixer.dylib
          - os: macos-14
            target: osx-arm64
            library: libSDL3_mixer.dylib

    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Clone SDL3
        shell: bash
        run: git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL sdl3-src

      - name: Clone SDL_mixer
        shell: bash
        run: git clone --depth 1 --branch "$SDL_MIXER_VERSION" --recurse-submodules https://github.com/libsdl-org/SDL_mixer sdl-mixer-src

      - name: Build SDL3
        shell: bash
        run: |
          cmake -S sdl3-src -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl3-install" \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build sdl3-build --config Release
          cmake --install sdl3-build --config Release

      - name: Build SDL_mixer
        shell: bash
        run: |
          cmake -S sdl-mixer-src -B sdl-mixer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/sdl3-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDLMIXER_VENDORED=ON \
            -DSDLMIXER_DEPS_SHARED=OFF
          cmake --build sdl-mixer-build --config Release --target SDL3_mixer-shared

      - name: Collect SDL_mixer artifact
        shell: bash
        run: |
          mkdir -p "staging/${{ matrix.target }}"
          library_path="$(find sdl-mixer-build -name '${{ matrix.library }}' -print -quit)"
          test -n "$library_path"
          cp -L "$library_path" "staging/${{ matrix.target }}/${{ matrix.library }}"

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: staging/${{ matrix.target }}
          if-no-files-found: error

  update-libraries:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          path: Fresnel.Audio/Internal/Native

      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          message: Updated SDL_mixer native libraries
          committer_name: GitHub Actions
          committer_email: actions@github.com
